
services:
  mariadb:
    image: mariadb:11.4

    container_name: dolibarr-db
    restart: unless-stopped
    command: --local-infile=1 
    # Option cruciale : autorise l'importation directe de fichiers locaux (comme tes CSV) dans les requêtes SQL
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dolibarr-network

  dolibarr:
    image: tuxgasy/dolibarr:latest
    container_name: dolibarr-web
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "8080:80"
    environment:
      DOLI_DB_HOST: ${DOLI_DB_HOST}
      DOLI_DB_NAME: ${DOLI_DB_NAME}
      DOLI_DB_USER: ${DOLI_DB_USER}
      DOLI_DB_PASSWORD: ${DOLI_DB_PASSWORD}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
      DOLI_MODULES: ${DOLI_MODULES}
    volumes:
      - dolibarr_documents:/var/www/documents
      - dolibarr_custom:/var/www/html/custom
    networks:
      - dolibarr-network

  importer:
     build:
      context: .
      dockerfile: docker/importer/Dockerfile
     depends_on:
       - mariadb
       - dolibarr
     environment:
      DB_HOST: mariadb
      DB_NAME: ${DOLI_DB_NAME}
      DB_USER: ${DOLI_DB_USER}
      DB_PASSWORD: ${DOLI_DB_PASSWORD}
     volumes:
      - ./data:/data:ro
     restart: "no"
     networks:
      - dolibarr-network

volumes:
  mariadb_data:
  dolibarr_documents:
  dolibarr_custom:

networks:
  dolibarr-network:
    driver: bridge
